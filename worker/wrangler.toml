name = "ryuchan-cms-oauth"
main = "index.ts"
compatibility_date = "2024-01-01"

# 路由：Worker 绑定到 auth.131714.xyz 处理 OAuth 回调
# 在 Cloudflare Dashboard 中：
#   1. DNS → 添加 A 记录 auth → 192.0.2.1（橙色云朵代理）
#   2. Workers Routes → auth.131714.xyz/* → ryuchan-cms-oauth
# 或者直接用 routes 配置（需要域名已在 Cloudflare 上）：
# routes = [
#   { pattern = "auth.131714.xyz/*", zone_name = "131714.xyz" }
# ]

[vars]
ALLOWED_USER = "kobaridev"
# 以下变量通过 npx wrangler secret put 设置（在 worker 目录下执行）：
# GITHUB_CLIENT_ID     - GitHub OAuth App 的 Client ID
# GITHUB_CLIENT_SECRET - GitHub OAuth App 的 Client Secret
# REDIRECT_URI         - GitHub OAuth 回调地址，必须与 GitHub OAuth App 设置一致
# CMS_ORIGIN           - CMS 前端地址，用于 CORS 和登录后跳转